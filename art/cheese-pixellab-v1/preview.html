  rows.forEach((row, dy) => {
    [...row].forEach((pixel, dx) => {
      if (!colors[pixel]) return;
      ctx.fillStyle = colors[pixel];
      ctx.fillRect(x + dx, y + dy, 1, 1);
    });
  });
}

function getIdlePose(elapsed) {
  const t = ((elapsed % CYCLE_MS) + CYCLE_MS) % CYCLE_MS;
  return {
    lift: t >= 1200 && t < 2400 ? -1 : 0,
    blink: (t >= 3200 && t < 3360) || (t >= 3520 && t < 3680),
    tail: [0, 1, 2, 3, 2, 1, 0, 0][Math.floor(t / 600)],
  };
}

function drawCat(ctx, elapsed, colors = palette, overrides = {}) {
  const pose = { ...getIdlePose(elapsed), ...overrides };
  ctx.clearRect(0, 0, SIZE, SIZE);
  ctx.imageSmoothingEnabled = false;

  ctx.fillStyle = '#33251f24';
  ctx.fillRect(4, 22, 17, 1);

  // Tail moves independently while paws remain planted.
  const tips = [[21, 15], [22, 14], [21, 13], [20, 14]];
  const [tx, ty] = tips[pose.tail];
  ctx.fillStyle = colors.o;
  ctx.fillRect(18, 19, 5, 3);
  ctx.fillRect(21, ty + 1, 2, 6);
  ctx.fillRect(tx, ty, 2, 2);
  ctx.fillStyle = colors.f;
  ctx.fillRect(18, 20, 4, 1);
  ctx.fillRect(21, ty + 2, 1, 6);

  paintRows(ctx, [
    '...oooooooo...',
    '..offfffffoo..',
    '.offfcccfffoo.',
    '.offccccfffoo.',
    '.osfccccffsfo.',
    '.offccccfffoo.',
    '.offccccfffoo.',
    'oofffcooffffoo',
    'occccoocccccco',
    '.oooo..oooooo.',
  ], 5, 13, colors);

  paintRows(ctx, head, 4, 3 + pose.lift, colors);
  ctx.fillStyle = colors.eye ?? colors.o;
  ctx.fillRect(8, 9 + pose.lift, 2, pose.blink ? 1 : 2);
  ctx.fillRect(15, 9 + pose.lift, 2, pose.blink ? 1 : 2);
  if (!pose.blink) {
    ctx.fillStyle = '#fff8e9';
    ctx.fillRect(8, 9 + pose.lift, 1, 1);
    ctx.fillRect(15, 9 + pose.lift, 1, 1);
  }
  ctx.fillStyle = colors.p;
  ctx.fillRect(12, 11 + pose.lift, 1, 1);
  ctx.fillStyle = colors.o;
  ctx.fillRect(11, 12 + pose.lift, 1, 1);
  ctx.fillRect(13, 12 + pose.lift, 1, 1);
  ctx.fillStyle = '#459b8f';
  ctx.fillRect(8, 14, 9, 1);
  ctx.fillStyle = '#ffe293';
  ctx.fillRect(12, 15, 2, 2);
}

function drawRestingCat(ctx, state, elapsed, colors = palette) {
  if (state === 'sleeping') {
    drawCat(ctx, 0, colors, { blink: true, lift: elapsed < 300 ? 1 : 2 });
    return;
  }
  const stretching = state === 'stretching';
  const active = elapsed >= 400 && elapsed < (stretching ? 2700 : 4200);
  drawCat(ctx, 0, colors, { blink: active, lift: stretching && active ? -1 : 0 });
  if (!active) return;
  if (stretching) {
    const raised = elapsed >= 800 && elapsed <= 2300;
    const arm = ['.oo.', 'occo', 'offo', ...Array(raised ? 8 : 3).fill('.ofo'), '.oo.'];
    paintRows(ctx, arm, 2, raised ? 5 : 11, colors);
    paintRows(ctx, arm, 19, raised ? 5 : 11, colors);
    ctx.fillStyle = colors.o;
    ctx.fillRect(12, 11, 2, 2);
  } else {
    // Lift a paw to the cheek, then rub in short strokes.
    const y = 10 + Math.floor(elapsed / 300) % 2;
    paintRows(ctx, ['.oo.', 'occo', 'offo', 'offo', 'offo', '.oo.'], 7, y, colors);
    ctx.fillStyle = colors.p;
    if (Math.floor(elapsed / 600) % 2) ctx.fillRect(11, 12, 1, 2);
  }
}

function drawEatingCat(ctx, elapsed, colors = palette) {
  drawCat(ctx, 0, colors);
  const chewing = elapsed >= 400 && elapsed < 1350;
  const mouthHeight = chewing ? 1 + Math.floor(elapsed / 150) % 2 : 1;
  // Cover the idle mouth, then chew with lifted paws and pink cheeks.
  ctx.fillStyle = colors.c;
  ctx.fillRect(10, 12, 5, 2);
  ctx.fillStyle = colors.o;
  ctx.fillRect(11, 12, 3, mouthHeight);
  ctx.fillStyle = colors.p;
  ctx.fillRect(7, 11, 2, 1);
  ctx.fillRect(16, 11, 2, 1);
  if (elapsed < 1350) {
    ctx.fillStyle = colors.l;
    ctx.fillRect(9, 14, 2, 2);
    ctx.fillRect(14, 14, 2, 2);
    ctx.fillStyle = '#459b8f';
    const x = elapsed < 400 ? 18 - Math.floor(elapsed / 80) : 12;
    ctx.fillRect(x, 13, chewing ? 1 : 3, 2);
  } else {
    // A small heart marks successful feeding before returning to idle.
    ctx.fillStyle = colors.p;
    paintRows(ctx, ['p.p', 'ppp', '.p.'], 19, 3, colors);
    ctx.fillStyle = colors.o;
    ctx.fillRect(11, 12, 1, 1);
    ctx.fillRect(13, 12, 1, 1);
    ctx.fillRect(12, 13, 1, 1);
  }
}

function drawResultCat(ctx, state, elapsed, colors = palette) {
  if (state === 'success') {
    drawEatingCat(ctx, 1500, colors);
    ctx.fillStyle = '#459b8f';
    const y = Math.floor(elapsed / 200) % 2 ? 4 : 5;
    ctx.fillRect(2, y, 1, 3);
    ctx.fillRect(1, y + 1, 3, 1);
    return;
  }
  drawCat(ctx, 0, colors);
  // Raised eyebrows, a small round mouth, and a blue question mark.
  ctx.fillStyle = colors.o;
  ctx.fillRect(8, 7, 2, 1);
  ctx.fillRect(15, 8, 2, 1);
  ctx.fillStyle = colors.c;
  ctx.fillRect(10, 12, 5, 2);
  ctx.fillStyle = colors.o;
  ctx.fillRect(12, 12, 2, 2);
  ctx.fillStyle = '#6a99b4';
  const y = Math.floor(elapsed / 250) % 2 ? 1 : 2;
  ctx.fillRect(20, y, 3, 1);
  ctx.fillRect(22, y + 1, 1, 1);
  ctx.fillRect(21, y + 2, 1, 1);
  ctx.fillRect(21, y + 4, 1, 1);
}

function drawAttackCat(ctx, elapsed, colors = palette) {
  drawCat(ctx, 0, colors);
  const extended = Math.floor(elapsed / 130) % 4 >= 1;
  // Lift the right paw, then swipe outwards with a small impact spark.
  paintRows(ctx, extended ? ['ooooo', 'offfo', 'occco', '.ooo.'] : ['ooo', 'ofo', 'oco', 'ooo'], extended ? 17 : 15, 13, colors);
  ctx.fillStyle = colors.o;
  ctx.fillRect(8, 8, 2, 1);
  ctx.fillRect(15, 8, 2, 1);
  if (extended) {
    ctx.fillStyle = '#ffe293';
    ctx.fillRect(22, 10, 1, 3);
    ctx.fillRect(21, 11, 3, 1);
  }
}

// Original lying-down poses share the same 24px canvas and ground line as idle.
function drawSleeping(ctx, elapsed, { species, shape, palette: p }) {
  ctx.clearRect(0, 0, 24, 24);
  ctx.imageSmoothingEnabled = false;
  const rows = (pixels, x, y) => pixels.forEach((row, dy) => [...row].forEach((cell, dx) => {
    if (!p[cell]) return;
    ctx.fillStyle = p[cell];
    ctx.fillRect(x + dx, y + dy, 1, 1);
  }));
  const breath = Math.floor(elapsed / 1400) % 2;
  ctx.fillStyle = '#33251f24';
  ctx.fillRect(2, 22, 21, 1);
  rows([
    '....oooooooo...', '...offffffffoo.', '..offfffffffffo',
    '.offffllllfffffo', 'offfllllllffffo', 'offccccccccfffo',
    '.ooooooooooooo.',
  ], 8, 16 - breath);
  // Ears preserve each dog's silhouette, even when curled up.
  if (species === 'cat') {
    rows(['oo......oo', 'ofo....ofo', 'opfoooofpo'], 3, 11);
  } else if (shape === 'retriever') {
    rows(['.ooo', 'osso', 'osso', 'osso', '.oo.'], 1, 15);
    rows(['ooo.', 'osso', 'osso', 'osso', '.oo.'], 12, 15);
  } else {
    const ears = shape === 'corgi' ? ['oo..', 'ofo.', 'opfo', 'offo'] : ['oo..', 'opoo', 'offo'];
    rows(ears, 3, shape === 'corgi' ? 10 : 11);
    rows(ears.map(row => [...row].reverse().join('')), 10, shape === 'corgi' ? 10 : 11);
  }
  rows([
    '..oooooooo..', '.offllllffo.', 'offllllllffo', 'ofllccccllfo',
    'ofccccccccfo', '.offccccffo.', '..oooooooo..',
  ], 2, 14);
  ctx.fillStyle = p.o;
  ctx.fillRect(5, 17, 2, 1);
  ctx.fillRect(10, 17, 2, 1);
  ctx.fillStyle = species === 'cat' ? p.p : p.o;
  ctx.fillRect(8, 18, species === 'cat' ? 1 : 2, 1);
  rows(['.oooo..oooo.', 'occccoocccco', '.oooo..oooo.'], 3, 20);
  if (species === 'cat') {
    rows(['...ooooooo', '..offffffo', '...oooooo.'], 13, 19);
  } else if (shape === 'shiba') {
    rows(['.oooo', 'offfo', 'of.oo', '.oo..'], 18, 17);
  } else if (shape === 'retriever') {
    rows(['..ooo', '.offo', 'offo.', '.oo..'], 18, 18);
  } else {
    rows(['.oo', 'ofo', '.oo'], 20, 19);
  }
  // Small pixel Zs rise slowly above the sleeping pet.
  const y = 7 - Math.floor(elapsed / 1100) % 3;
  ctx.fillStyle = '#6a99b4';
  for (const [x, dy] of [[16, 0], [20, -3]]) {
    ctx.fillRect(x, y + dy, 3, 1);
    ctx.fillRect(x + 1, y + dy + 1, 1, 1);
    ctx.fillRect(x, y + dy + 2, 3, 1);
  }
}

const images = {};
window.images = images;
let action = 'idle', frame = 0, elapsed = 0, last = performance.now(), playing = !matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = selector => document.querySelector(selector);
if (atlas.logicalFrame?.width === 24) {
  document.body.dataset.pixelStyle = '24';
  $('h1').textContent = '치즈 고양이 · 도트 스프라이트 비교';
  $('#sprite-note').textContent = '24×24 도트 · 기존 색상 · PNG를 4배 확대';
  $('.spec p:last-child').textContent = '수정 시안: 굵은 도트 · 잠자기 얼굴 위치 고정';
}
if (atlas.provider === 'PixelLab' && atlas.presentation !== 'new-design') {
  $('h1').textContent = '치즈 고양이 · PixelLab 비교';
  $('.card:last-child strong').textContent = 'PixelLab 이미지';
  $('#sprite-note').textContent = '기존 24×24 그림을 입력 · 생성한 PNG를 정확히 4배 확대';
  $('.spec p:last-child').textContent = 'PixelLab 시안 · 잠자기는 얼굴과 발을 고정하고 등에 생성 모션 적용';
}
if (atlas.presentation === 'new-design') {
  document.title = 'BytePet · 마멀레이드';
  $('h1').textContent = '마멀레이드 · 새로운 치즈 고양이';
  $('header p').textContent = 'PixelLab으로 새로 디자인한 고양이의 대기와 잠자기 모션을 살펴보세요.';
  $('.card:first-child strong').textContent = '기준 자세';
  $('.card:first-child .tag').textContent = '새로 생성한 디자인';
  $('.card:first-child .note').textContent = '코드 그림을 참조하지 않고 텍스트로 만든 캐릭터';
  $('.card:last-child strong').textContent = '움직이는 모습';
  $('#sprite-note').textContent = '생성된 전체 동작을 재생 · 얼굴과 몸을 자연스럽게 움직임';
  $('#original').width = $('#original').height = 96;
  $('#original').setAttribute('aria-label', '새 고양이 기준 자세');
  $('#sprite').setAttribute('aria-label', '새 고양이 애니메이션');
  $('.spec p:first-child').textContent = '96×96px · 4열×2행 · 투명 PNG · 모든 동작에 동일한 2배 확대';
  $('.spec p:last-child').textContent = '프레임별 크기 변경 없음 · 바닥선 90px';
  document.documentElement.style.setProperty('--floor-offset', '42px');
}
const oldContext = $('#original').getContext('2d'), newContext = $('#sprite').getContext('2d');
function setPlaying(value) { playing = value; last = performance.now(); $('#play').textContent = playing ? '일시 정지' : '재생'; }
function paint() {
  const image = images[action];
  if (!image) return;
  newContext.clearRect(0, 0, 96, 96);
  newContext.imageSmoothingEnabled = false;
  newContext.drawImage(image, frame % 4 * 96, Math.floor(frame / 4) * 96, 96, 96, 0, 0, 96, 96);
  if (atlas.presentation === 'new-design') {
    oldContext.clearRect(0, 0, 96, 96); oldContext.imageSmoothingEnabled = false;
    oldContext.drawImage(image, 0, 0, 96, 96, 0, 0, 96, 96);
  } else if (action === 'idle') drawCat(oldContext, elapsed);
  else drawSleeping(oldContext, elapsed, { species: 'cat', palette });
  $('#frame').textContent = `${frame + 1} / 8`;
  [...document.querySelectorAll('.film button')].forEach((button, i) => button.setAttribute('aria-pressed', String(i === frame)));
}
function selectFrame(index) {
  setPlaying(false); frame = index;
  elapsed = atlas.actions[action].durationMs.slice(0, index).reduce((a, b) => a + b, 0);
  paint();
}
function selectAction(next) {
  action = next; frame = 0; elapsed = 0; last = performance.now();
  for (const name of ['idle', 'sleeping']) $(`#${name}`).setAttribute('aria-pressed', String(name === action));
  for (const [i, thumbnail] of [...document.querySelectorAll('.film canvas')].entries()) {
    const ctx = thumbnail.getContext('2d'); ctx.clearRect(0, 0, 96, 96);
    ctx.drawImage(images[action], i % 4 * 96, Math.floor(i / 4) * 96, 96, 96, 0, 0, 96, 96);
  }
  paint();
}
try {
  await Promise.all(Object.entries(sheets).map(async ([action, source]) => {
    const image = new Image(); image.src = source; await image.decode(); images[action] = image;
  }));
  for (let i = 0; i < 8; i++) {
    const button = document.createElement('button'); button.setAttribute('aria-label', `${i + 1}번 프레임`);
    const thumb = document.createElement('canvas'); thumb.width = thumb.height = 96; thumb.setAttribute('aria-hidden', 'true');
    const label = document.createElement('span'); label.textContent = i + 1;
    button.append(thumb, label); button.addEventListener('click', () => selectFrame(i)); $('.film').append(button);
  }
  for (const name of ['idle', 'sleeping']) $(`#${name}`).addEventListener('click', () => selectAction(name));
  $('#play').addEventListener('click', () => setPlaying(!playing));
  $('#next').addEventListener('click', () => selectFrame((frame + 1) % 8));
  $('#zoom').addEventListener('change', event => document.querySelectorAll('.stage').forEach(el => el.style.setProperty('--zoom', event.target.value)));
  $('#guides').addEventListener('change', event => document.body.classList.toggle('guides', event.target.checked));
  matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', event => { if (event.matches) setPlaying(false); });
  document.addEventListener('visibilitychange', () => { last = performance.now(); });
  setPlaying(playing); selectAction('idle'); document.body.dataset.ready = 'true';
  function tick(now) {
    if (playing && !document.hidden) {
      const duration = atlas.actions[action].durationMs;
      elapsed = (elapsed + now - last) % duration.reduce((a, b) => a + b, 0);
      let remainder = elapsed; frame = 0;
      while (frame < 7 && remainder >= duration[frame]) remainder -= duration[frame++];
      paint();
    }
    last = now; requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
} catch (error) { $('#error').hidden = false; $('#error').textContent = `미리보기를 불러오지 못했어요: ${error.message}`; }
</script>
