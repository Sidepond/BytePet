<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'">
    <title>BytePet 유틸리티</title>
    <link rel="stylesheet" href="panel.css">
  </head>
  <body>
    <main role="dialog" aria-modal="false" aria-labelledby="panel-title">
      <header>
        <div><p class="brand">BYTEPET <span>●</span></p><h1 id="panel-title">오늘의 먹이</h1></div>
        <button id="close" type="button" aria-label="패널 닫기" title="닫기 (Esc)">×</button>
      </header>
      <label for="draft">텍스트 먹이</label>
      <textarea id="draft" spellcheck="false" placeholder="텍스트를 붙여넣거나, 파일·사진을 여기로 드롭하세요." aria-describedby="draft-hint"></textarea>
      <p id="draft-hint">텍스트 1MB · 파일당 25MB · 한 번에 10개</p>
      <div class="feed-actions">
        <button id="feed-text" type="button">먹이 주기</button>
        <button id="choose-files" type="button">파일·사진 선택</button>
        <input id="files" type="file" multiple hidden>
      </div>
      <p id="feed-status" role="status" aria-live="polite">먹인 내용은 이 컴퓨터에 저장됩니다.</p>
      <section aria-labelledby="shelf-title">
        <div class="shelf-header"><h2 id="shelf-title">보관함</h2><button id="open-folder" type="button">폴더 열기</button></div>
        <ul id="food-list" aria-label="저장된 먹이"></ul>
        <p id="empty-shelf">아직 먹이가 없어요. 첫 먹이를 주세요!</p>
      </section>
      <footer>JWT·JSON 변환, 포트 확인은 준비 중<kbd>Esc 닫기</kbd></footer>
    </main>
    <script type="module" src="panel.js"></script>
  </body>
</html>
